<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Een Warme Thuis</title>
<meta name="description" content="Een kleine retro-game over omkijken naar elkaar. Gemaakt voor De Warmste Week.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Een Warme Thuis - spel"></canvas>
</div>

<div id="touch" aria-hidden="true">
  <div class="dpad">
    <button data-act="up" class="up">▲</button>
    <button data-act="left" class="left">◀</button>
    <button data-act="right" class="right">▶</button>
    <button data-act="down" class="down">▼</button>
  </div>
  <div class="ab">
    <button data-act="skip" class="x">X</button>
    <button data-act="ok" class="z">Z</button>
    <button id="fbtn" class="f">F</button>
  </div>
</div>

<noscript><p style="color:#fff;text-align:center">Zet JavaScript aan om te spelen.</p></noscript>

<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/decor.js"></script>
<script src="js/closeups.js"></script>
<script src="js/common.js"></script>
<script src="js/l1.js"></script>
<script src="js/l2.js"></script>
<script src="js/l3.js"></script>
<script src="js/l4.js"></script>
<script src="js/l5.js"></script>
<script src="js/l6.js"></script>
<script src="js/l7.js"></script>
<script src="js/l8.js"></script>
<script src="js/l9.js"></script>
  <script src="js/eggs.js"></script>
<script src="js/endings.js"></script>
<script src="js/feedback.js"></script>
<script src="js/main.js"></script>
</body>
</html>
